[sssd]
services = nss, pam, autofs
config_file_version = 2
domains = lscat

# Enable me when we have authn problems.
#debug_level = 9

[nss]
homedir_substring = /pf/users

[pam]

[domain/lscat]
#
# The LDAP server does not contain the SUDO policies, the policy is
# contained locally and uniformly within /etc/sudoers for all machines.
#
autofs_provider = ldap
id_provider = ldap
auth_provider = ldap
chpass_provider = ldap
sudo_provider = none
ldap_pwd_policy = none
access_provider = permit

#
# Config params defining the expected structure of the LDAP database.
# EXOP is not necessary to run "passwd".
#
ldap_schema = rfc2307
ldap_chpass_use_exop = False
ldap_user_object_class = posixAccount
ldap_group_object_class = posixGroup
ldap_group_name = cn
ldap_user_search_base = ou=users,dc=ls-cat,dc=org
ldap_group_search_base = ou=groups,dc=ls-cat,dc=org

#
# Config params defining how to connect to LDAP.
#
# ca-certificates.crt is the master list of trusted top-level certificates.
#
# We use an encrypted connection despite operating on a trusted internal network
# because the logins and the "passwd" command do not encrypt passwords before
# sending them over the wire.
#
# We use LDAPS instead of startTLS because TLS negotiation is simpler.
#
ldap_uri = ldaps://ldap1.ls-cat.org
ldap_id_use_start_tls = false 
ldap_tls_reqcert = demand
ldap_tls_cacert  = /etc/ssl/certs/ca-certificates.crt

#
# Performance-tuning/caching parameters.
#
# Put a reasonable time limit on caching of user entries so the client doesn't
# read stale data in perpetuity.
#
cache_credentials = true
entry_cache_user_timeout = 60
entry_cache_group_timeout = 60
ldap_network_timeout = 5
ldap_opt_timeout = 5
ldap_search_timeout = 5
ldap_enumeration_search_timeout = 5


[sudo]
[autofs]


[ssh]
[pac]
[ifp]
